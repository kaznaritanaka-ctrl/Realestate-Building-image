name: PR validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/site-report-a4-landscape]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      # A4横・3ページで印刷できるかをヘッドレスChromeで確認する（サンプルデータのみ）。
      - name: Install CJK fonts for print validation
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: PDF print smoke test
        run: |
          node scripts/report-preview.mjs /tmp/land-report-preview.html
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=/tmp/land-report-preview.pdf file:///tmp/land-report-preview.html
          pdfinfo /tmp/land-report-preview.pdf | grep -E '^Pages:[[:space:]]+3$'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land-report-preview
          path: /tmp/land-report-preview.pdf
          if-no-files-found: ignore
